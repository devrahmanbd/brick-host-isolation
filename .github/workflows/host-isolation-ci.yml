name: Brick Host Isolation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase1-lifecycle-contract:
    name: Phase 1 lifecycle and attestation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          check-latest: true
      - name: Validate Phase 1 lifecycle contract
        run: bash ci/phase1-validate.sh

  phase2-root-broker:
    name: Phase 2 root-broker gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          check-latest: true
      - name: Validate Phase 2 root-owned broker
        run: bash ci/phase2-validate.sh

  phase3-host-preflight:
    name: Phase 3 host-preflight and base-root gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          check-latest: true
      - name: Validate Phase 3 host preflight and immutable base root
        run: bash ci/phase3-validate.sh

  phase4-isolation-plan:
    name: Phase 4 isolation-plan gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          check-latest: true
      - name: Validate Phase 4 isolation plan
        run: bash ci/phase4-validate.sh

  phase5-resource-egress:
    name: Phase 5 resource and egress-policy gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          check-latest: true
      - name: Validate Phase 5 resource and egress policy
        run: bash ci/phase5-validate.sh

  phase6-executable-integrity:
    name: Phase 6 executable-integrity gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          check-latest: true
      - name: Validate Phase 6 executable and environment integrity
        run: bash ci/phase6-validate.sh

  phase7-recovery:
    name: Phase 7 recovery gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          check-latest: true
      - name: Validate Phase 7 signed recovery controls
        run: bash ci/phase7-validate.sh

  phase8-edition-staging:
    name: Phase 8 edition and staging gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          check-latest: true
      - name: Validate Phase 8 edition adapters and staging evidence
        run: bash ci/phase8-validate.sh

  phase9-certification-release:
    name: Phase 9 certification and guarded-release gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          check-latest: true
      - name: Validate Phase 9 certification and guarded release
        run: bash ci/phase9-validate.sh
