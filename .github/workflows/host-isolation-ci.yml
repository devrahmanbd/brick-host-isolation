name: Brick Host Isolation CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  phase1-lifecycle-contract:
    name: Phase 1 lifecycle and attestation gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          check-latest: true
      - name: Validate Phase 1 lifecycle contract
        run: bash ci/phase1-validate.sh

  phase2-root-broker:
    name: Phase 2 root-broker gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          check-latest: true
      - name: Validate Phase 2 root-owned broker
        run: bash ci/phase2-validate.sh

  phase3-host-preflight:
    name: Phase 3 host-preflight and base-root gate
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22.x"
          check-latest: true
      - name: Validate Phase 3 host preflight and immutable base root
        run: bash ci/phase3-validate.sh
